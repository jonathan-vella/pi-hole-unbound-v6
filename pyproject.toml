[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
	".git",
	".venv",
	"venv",
	"data",
	"htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "venv", "data"]
